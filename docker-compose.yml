name: tripmaxing

services:
  db:
    image: postgis/postgis:17-3.5
    # The official image has no arm64 build.
    platform: linux/amd64
    environment:
      POSTGRES_USER: tripmaxing
      POSTGRES_PASSWORD: tripmaxing
      POSTGRES_DB: tripmaxing
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:

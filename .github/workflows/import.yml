name: Monthly import

# New places and last month's views for the whole world.
# Off until the ENABLE_IMPORT variable is "true": it needs the DATABASE_URL secret and rewrites the whole table.
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  import:
    name: Import places and views
    runs-on: ubuntu-latest
    if: vars.ENABLE_IMPORT == 'true'
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WIKIMEDIA_USER_AGENT: tripmaxing/0.1 (https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm import:places
      - run: pnpm import:views

<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>tripmaxing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0;display:flex;height:100vh;font:15px system-ui,sans-serif}#side{width:340px;overflow:auto;padding:16px;box-sizing:border-box}
#map{flex:1}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 4px}ol{padding-left:22px;margin:6px 0}li{margin:5px 0}
small{color:#555}.warn{background:#fff4d6;padding:8px;border-radius:6px;font-size:13px;margin-top:10px}
@media(max-width:700px){body{flex-direction:column-reverse}#side{width:auto;height:45vh}}</style></head>
<body><aside id="side"><h1 id="title"></h1><small>Curseur insolite : 1</small>
<p class="warn">Accès non vérifié : certains lieux peuvent être fermés, privés ou sans vestige visible. Distances et durées estimées.</p></aside>
<main id="map" aria-label="Carte de l'itinéraire"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const {city,lang,center,days}={"city": "Lyon", "lang": "fr", "center": [45.764, 4.8357], "days": [{"color": "#d7263d", "km": 5.5, "hours": 4.2, "stops": [{"title": "Maison du Soleil", "lat": 45.7592774, "lon": 4.8254359, "description": "immeuble historique situé dans le 5e arrondissement de Lyon, dans le quartier du Vieux-Lyon"}, {"title": "Carmel de Lyon", "lat": 45.759553, "lon": 4.817565, "description": "établissement monastique français"}, {"title": "Atelier de poterie antique de Lyon-la Muette", "lat": 45.7646, "lon": 4.819, "description": "atelier de céramique à Lyon à l'époque gallo-romaine"}, {"title": "Montée de l'Amphithéâtre", "lat": 45.76987, "lon": 4.83036, "description": "voie de Lyon, en France"}, {"title": "Tomaselli Collection", "lat": 45.762180495, "lon": 4.842255254, "description": "musée d'art privé français à Lyon"}, {"title": "Théâtre Bellecour", "lat": 45.7583, "lon": 4.83468, "description": "ancien théâtre lyonnais devenu le siège du Progrès puis la FNAC Lyon"}]}, {"color": "#1b6ca8", "km": 6.7, "hours": 4.5, "stops": [{"title": "Tour Pitrat", "lat": 45.773143, "lon": 4.829511, "description": "monument détruit de Lyon"}, {"title": "Rue Adamoli", "lat": 45.772698, "lon": 4.835728, "description": "rue de Lyon, en France"}, {"title": "Galerie Vrais Rêves", "lat": 45.77665, "lon": 4.83376, "description": "galerie d'art à Lyon, France"}, {"title": "Cimetières de la Croix-Rousse", "lat": 45.7829, "lon": 4.81965, "description": "cimetière lyonnais"}, {"title": "Couvent des Carmes déchaussés de Lyon", "lat": 45.766417, "lon": 4.823379, "description": "ancien couvent à Lyon"}, {"title": "Petit passage de l'Argue", "lat": 45.7614, "lon": 4.83459, "description": "voie du 2e arrondissement de Lyon, en France"}]}, {"color": "#2e8b57", "km": 5.3, "hours": 4.2, "stops": [{"title": "Couvent de la Visitation Sainte-Marie de Fourvière", "lat": 45.758713, "lon": 4.816689, "description": "ancien couvent situé dans le Rhône, en France"}, {"title": "Cirque antique de Lyon", "lat": 45.7602, "lon": 4.81517, "description": "cirque romain situé à Lyon, en France"}, {"title": "Grenier d'abondance (Lyon)", "lat": 45.7696, "lon": 4.81475, "description": "ancien grenier public dans le 1er arrondissement de Lyon (Rhône)"}, {"title": "Pont la Feuillée", "lat": 45.76652, "lon": 4.82944, "description": "pont sur la Saône à Lyon"}, {"title": "Temple protestant des Terreaux", "lat": 45.766661, "lon": 4.831727, "description": "temple protestant à Lyon 1er"}, {"title": "Square Janmot", "lat": 45.75439, "lon": 4.82582, "description": "square à Lyon, en France"}]}]}, side=document.getElementById('side'), map=L.map('map');
document.getElementById('title').textContent='Itinéraire '+city;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap | Textes : Wikipédia CC BY-SA'}).addTo(map);
const url=s=>`https://${lang}.wikipedia.org/wiki/`+encodeURIComponent(s.title.replaceAll(' ','_'));
const link=s=>{const a=document.createElement('a');a.href=url(s);a.target='_blank';a.rel='noopener';a.textContent=s.title;return a};
const bounds=[];
days.forEach((d,i)=>{
  const h=document.createElement('h2');h.textContent=`Jour ${i+1}`;h.style.color=d.color;
  const info=document.createElement('small');info.textContent=`≈ ${d.km} km à pied, ≈ ${d.hours} h avec visites`;
  const ol=document.createElement('ol');side.append(h,info,ol);
  const line=d.stops.map(s=>[s.lat,s.lon]);bounds.push(...line);
  L.polyline(line,{color:d.color,weight:3,dashArray:'6 6'}).addTo(map);
  d.stops.forEach((s,n)=>{
    const li=document.createElement('li');li.append(link(s));ol.append(li);
    const box=document.createElement('div'),b=document.createElement('b');b.append(link(s));box.append(b);
    if(s.description){const p=document.createElement('div');p.textContent=s.description;box.append(p)}
    L.circleMarker([s.lat,s.lon],{radius:8,color:d.color,fillOpacity:.85}).bindPopup(box).bindTooltip(`J${i+1}.${n+1}`).addTo(map);
  });
});
// The container can be 0px wide at load: zooming then maxes out, so fit again on every resize.
new ResizeObserver(()=>{map.invalidateSize();if(map.getSize().x)bounds.length?map.fitBounds(bounds,{padding:[30,30]}):map.setView(center,13)}).observe(document.getElementById('map'));
</script></body></html>
